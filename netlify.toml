# Netlify deployment configuration for vsj-website.
#
# Reference: https://docs.netlify.com/frameworks/next-js/overview/
#
# Netlify's Next.js Runtime auto-handles the build output (.next), SSG pages,
# route handlers (/api/*), and image optimization. We explicitly set Node
# version and environment defaults so deploys are reproducible.
#
# The site's per-response headers (HSTS, X-Frame-Options, CSP, etc.) come
# from next.config.ts and are NOT duplicated here.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Lock Node to the version this project was tested against.
  # Bump alongside engines.node in package.json when upgrading.
  NODE_VERSION = "22.19.0"
  # NPM noise suppression — speeds up cold builds slightly.
  NPM_FLAGS = "--no-audit --no-fund --prefer-offline"
  # Surface Next.js telemetry opt-out for consistent build logs.
  NEXT_TELEMETRY_DISABLED = "1"

# ─── Production context ──────────────────────────────────────────────
# Used for builds on the main branch. NEXT_PUBLIC_SITE_URL drives the
# canonical metadata, sitemap.xml, robots.txt, and JSON-LD Organization
# entry. Override in the Netlify dashboard once vsjailabs.com goes live.
[context.production.environment]
  NEXT_PUBLIC_SITE_URL = "https://vsjailabs.com"

# ─── Deploy preview (pull requests) ──────────────────────────────────
# DEPLOY_PRIME_URL is set automatically by Netlify to the preview URL.
# This keeps canonical URLs accurate per-environment so we never index a
# preview deploy as the canonical site.
[context.deploy-preview.environment]
  NEXT_PUBLIC_SITE_URL = "$DEPLOY_PRIME_URL"

# ─── Branch deploys (non-main branches) ──────────────────────────────
[context.branch-deploy.environment]
  NEXT_PUBLIC_SITE_URL = "$DEPLOY_PRIME_URL"

# ─── Plugins ─────────────────────────────────────────────────────────
# Netlify auto-installs @netlify/plugin-nextjs when it detects Next.js,
# but we declare it explicitly so the contract is visible in the repo.
[[plugins]]
  package = "@netlify/plugin-nextjs"
