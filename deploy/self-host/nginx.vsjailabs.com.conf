server {
    server_name vsjailabs.com www.vsjailabs.com;

    client_max_body_size 2m;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;
    proxy_buffering off;
    proxy_request_buffering off;

    # Security headers are set by Next.js in next.config.ts — do NOT add
    # `add_header` directives here. Doing so produces duplicate headers
    # that weaken the site (Nginx add_header emitted a shorter HSTS +
    # narrower Permissions-Policy than Next.js — Trap fixed 2026-07-03).

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/vsjailabs.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vsjailabs.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}

server {
    if ($host = www.vsjailabs.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = vsjailabs.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name vsjailabs.com www.vsjailabs.com;
    return 404; # managed by Certbot

}
