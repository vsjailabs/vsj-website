# VSJ AI Labs website reverse proxy.
# Install as /etc/nginx/sites-available/vsjailabs.com and symlink to sites-enabled.
#
# Assumes:
# - ERPNext/Frappe keeps its own vhost(s).
# - OpenProject remains proxied separately, commonly to 127.0.0.1:8081.
# - This Next.js service listens only on 127.0.0.1:3017.

server {
    listen 80;
    listen [::]:80;
    server_name vsjailabs.com www.vsjailabs.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name vsjailabs.com www.vsjailabs.com;

    # Certbot normally manages these paths.
    ssl_certificate /etc/letsencrypt/live/vsjailabs.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vsjailabs.com/privkey.pem;

    client_max_body_size 2m;

    # Next.js App Router can stream responses. Disable proxy buffering so
    # the reverse proxy does not hold streamed chunks until the response ends.
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}

